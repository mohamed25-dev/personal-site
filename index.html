<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohamed Mirghani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){var t=localStorage.getItem('theme-preference');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})()</script>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <span></span>
    <button class="theme-toggle" aria-label="Toggle dark mode">// dark</button>
  </div>
</nav>

<section class="intro">
  <div class="container">
    <h1>Mohamed Mirghani</h1>
    <p>Software engineer interested in learning how things work under the hood. I write about what I learn along the way.</p>
    <div class="links">
      <a href="https://github.com/mohamed25-dev">GitHub</a>
      <a href="https://www.linkedin.com/in/mohamed257/">LinkedIn</a>
    </div>
  </div>
</section>

<hr>

<section class="blog">
  <div class="container">
    <h2>Blog</h2>

    <div class="label-filter" id="label-filter">
      <button class="filter-btn active" data-filter="all">all</button>
    </div>

    <div class="blog-item" data-labels="databases postgres">
      <a class="title" href="blog/postgres-default-values.html">Adding Columns to Big Tables in PostgreSQL</a>
      <span class="date">May 6, 2026</span>
    </div>

    <div class="blog-item" data-labels="operating-systems">
      <a class="title" href="blog/virtual-memory.html">How Does Virtual Memory Work?</a>
      <span class="date">Feb 25, 2026</span>
    </div>

    <div class="blog-item" data-labels="operating-systems">
      <span class="title">How Your Program Uses Memory</span>
      <span class="date status">coming soon</span>
    </div>
  </div>
</section>

<script src="theme.js"></script>
<script>
(function () {
  const items = Array.from(document.querySelectorAll('.blog-item[data-labels]'));
  const allLabels = [...new Set(items.flatMap(el => el.dataset.labels.split(' ')))].sort();
  const bar = document.getElementById('label-filter');

  allLabels.forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.filter = label;
    btn.textContent = label;
    btn.onclick = () => setFilter(label);
    bar.appendChild(btn);
  });

  bar.querySelector('[data-filter="all"]').onclick = () => setFilter('all');

  function setFilter(active) {
    bar.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === active);
    });
    document.querySelectorAll('.blog-item').forEach(item => {
      if (active === 'all') {
        item.style.display = '';
      } else if (!item.dataset.labels) {
        item.style.display = 'none';
      } else {
        item.style.display = item.dataset.labels.split(' ').includes(active) ? '' : 'none';
      }
    });
    history.replaceState(null, '', active === 'all' ? location.pathname : '#' + active);
  }

  const hash = location.hash.slice(1);
  if (hash && allLabels.includes(hash)) setFilter(hash);
})();
</script>
<script data-goatcounter="https://mohamed25.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
